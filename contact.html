<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub - Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      overflow-x: hidden;
    }

    /* NAVBAR */
    nav {
      background: #28caa7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      border-radius: 15px;
      margin: 10px;
    }

    nav a img {
      width: 50px;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #000;
      font-size: 18px;
      font-weight: 600;
    }

    /* CART ICON */
    .cart {
      position: relative;
      font-size: 22px;
      cursor: pointer;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -10px;
      background: red;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
    }

    /* PAGE HEADER */
    header h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 28px;
    }

    /* CONTACT FORM */
    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      font-size: 16px;
    }

    button {
      background: #28caa7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
    }

    button:hover {
      background: #1ba88a;
    }

    /* CART MODAL */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cart-content {
      background: #fff;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 10px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* FOOTER */
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 12px;
      margin-top: 30px;
      font-size: 14px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        text-align: center;
      }

      .nav-links {
        flex-direction: column;
        gap: 10px;
      }

      nav a img {
        width: 60px;
      }

      header h1 {
        font-size: 24px;
      }

      input,
      textarea {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <a href="index2.html"><img src="images (2).jpeg" alt="logo"></a>

    <div class="nav-links">
      <a href="index2.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="cart" id="cartBtn">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count" id="cartCount">0</span>
    </div>
  </nav>

  <header>
    <h1>📩 Contact FoodieHub</h1>
  </header>

  <!-- Contact Form -->
  <main>
    <form id="contactForm">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <p>Total: $<span id="cartTotal">0</span></p>
      <button id="closeCart">Close</button>
      <button id="checkoutBtn">Checkout</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 FoodieHub. All Rights Reserved.</p>
  </footer>

  <script>
    // CART SYSTEM
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateCartCount() {
      document.getElementById('cartCount').innerText =
        cart.reduce((s, i) => s + i.qty, 0);
    }

    function renderCart() {
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = "";

      let total = 0;
      cart.forEach((item, i) => {
        total += item.price * item.qty;
        cartItems.innerHTML += `<p>${item.name} × ${item.qty} - $${(item.price * item.qty).toFixed(2)}</p>`;
      });

      document.getElementById('cartTotal').innerText = total.toFixed(2);
      updateCartCount();
    }

    document.getElementById('cartBtn').onclick = () => {
      document.getElementById('cartModal').style.display = 'flex';
      renderCart();
    };

    document.getElementById('closeCart').onclick = () =>
      document.getElementById('cartModal').style.display = 'none';

    document.getElementById('checkoutBtn').onclick = () => {
      localStorage.setItem('cart', JSON.stringify(cart));
      localStorage.setItem('total', cart.reduce((s, i) => s + i.price * i.qty, 0).toFixed(2));
      window.location.href = "checkout.html";
    };

    updateCartCount();


    // CONTACT FORM MESSAGE
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Your message has been sent! Thank you.");
      e.target.reset();
    });
  </script>

</body>

</html>
